<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin Sign In — PlayMetric</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-auth">

<div class="admin-auth__bg" style="background-image: url('https://picsum.photos/seed/playmetric-admin/1600/1200')" aria-hidden="true"></div>
<div class="admin-auth__scrim" aria-hidden="true"></div>

<main class="admin-auth__card">
  <div class="admin-auth__brand">
    <span class="admin-auth__mark" aria-hidden="true">
      <img src="/media/playmetric-logo.png" alt="" />
    </span>
    <span class="admin-auth__word">PlayMetric</span>
  </div>

  <h1 class="admin-auth__title">Admin sign in</h1>
  <p class="admin-auth__subtitle">Leads and demo requests captured from the site.</p>

  <form id="loginForm" class="admin-auth__form" novalidate>
    <label class="demo-form__field">
      <span>Email</span>
      <input type="email" name="email" autocomplete="username" required maxlength="254" />
    </label>

    <label class="demo-form__field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required maxlength="200" />
    </label>

    <p class="demo-form__error" id="loginError" role="alert" hidden></p>

    <button type="submit" class="btn btn--solid btn--lg admin-auth__submit">
      <span class="admin-auth__submit-label">Sign in</span>
    </button>
  </form>
</main>

<script src="js/login.js"></script>
</body>
</html>
